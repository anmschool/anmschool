<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8A3A5C" />
    <meta name="description" content="올네이션스 경배와찬양 — 경배와찬양학교 · 큰잔치 · 훈련 안내" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ANM" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 글꼴은 화면 표시를 막지 않도록 비동기 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
    <link rel="preload" as="image" href="/images/slides/1.jpg" />
    <style>
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#FBFBF7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#6E1F3A;z-index:9999}
      #boot b{font:600 13px/1 Georgia,serif;letter-spacing:.42em;padding-left:.42em}
      #boot i{display:block;width:120px;height:2px;background:rgba(110,31,58,.15);overflow:hidden;position:relative}
      #boot i::after{content:"";position:absolute;left:-40%;top:0;width:40%;height:100%;background:#6E1F3A;animation:bootbar 1s ease-in-out infinite}
      @keyframes bootbar{to{left:100%}}
      @media (prefers-reduced-motion:reduce){#boot i::after{animation:none;left:0;width:100%}}
    </style>
    <title>2027 WINTER 경배와찬양학교</title>
  </head>
  <body>
    <div id="root"><div id="boot"><b>ANM</b><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
